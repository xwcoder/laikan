name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run lint
      - name: Parser and storage regression tests
        run: npm test
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke.cjs
      - name: Smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: node scripts/smoke.cjs
