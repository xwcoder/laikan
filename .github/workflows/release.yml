name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild for macOS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-latest"]' || '["macos-latest", "ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release tag
        shell: bash
        run: |
          node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) throw Error("Tag must match the package version")'
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run lint
      - name: Parser and storage regression tests
        run: npm test
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm
      - name: Build Linux and Windows installers
        if: runner.os != 'macOS'
        run: npm run make
      - name: Build signed macOS installers
        if: runner.os == 'macOS'
        env:
          YIKAN_UPDATE_PUBLIC_KEY: ${{ vars.YIKAN_UPDATE_PUBLIC_KEY }}
        run: |
          if [[ -f scripts/sign-macos-update.cjs ]]; then
            : "${YIKAN_UPDATE_PUBLIC_KEY:?Set the YIKAN_UPDATE_PUBLIC_KEY Actions variable}"
          fi
          # Use the same signing settings when rebuilding an older tag.
          npm run make -- --mac --arm64 -c.forceCodeSigning=true \
            -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
      - name: Verify macOS installers
        if: runner.os == 'macOS'
        run: |
          stem="release/yikan-${RELEASE_TAG#v}-mac-arm64"
          work_dir=$(mktemp -d)
          mount_dir="$work_dir/volume"
          app_pid=''
          cleanup() {
            if [[ -n "$app_pid" ]]; then kill "$app_pid" 2>/dev/null || true; fi
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$work_dir"
          }
          trap cleanup EXIT
          mkdir "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$stem.dmg"
          ditto "$mount_dir/一刊.app" "$work_dir/一刊.app"
          ditto -x -k "$stem.zip" "$work_dir/zip"
          codesign --verify --deep --strict "$work_dir/一刊.app"
          codesign --verify --deep --strict "$work_dir/zip/一刊.app"
          if [[ -f scripts/exclude-macos-update-dependencies.cjs ]]; then
            node_modules/.bin/asar list "$work_dir/zip/一刊.app/Contents/Resources/app.asar" > "$work_dir/asar-files"
            if grep -Eq '/node_modules/electron-updater(/|$)' "$work_dir/asar-files"; then
              echo '::error::The macOS app contains the Windows and Linux updater.'
              exit 1
            fi
            if grep -Eq '^/(out|release)(/|$)' "$work_dir/asar-files"; then
              echo '::error::The macOS app contains cached builds or installer output.'
              exit 1
            fi
          fi
          "$work_dir/一刊.app/Contents/MacOS/一刊" --user-data-dir="$work_dir/profile" > "$work_dir/launch.log" 2>&1 &
          app_pid=$!
          for attempt in {1..30}; do
            if [[ -s "$work_dir/profile/yikan.db" ]] && pgrep -P "$app_pid" -f '一刊 Helper \(Renderer\)' >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$work_dir/launch.log"
          echo '::error::The packaged macOS app did not start its renderer.'
          exit 1
      - name: Sign macOS update archive
        if: runner.os == 'macOS'
        env:
          YIKAN_UPDATE_PUBLIC_KEY: ${{ vars.YIKAN_UPDATE_PUBLIC_KEY }}
          YIKAN_UPDATE_PRIVATE_KEY: ${{ secrets.YIKAN_UPDATE_PRIVATE_KEY }}
        run: |
          if [[ -f scripts/sign-macos-update.cjs ]]; then
            : "${YIKAN_UPDATE_PRIVATE_KEY:?Set the YIKAN_UPDATE_PRIVATE_KEY Actions secret}"
            node scripts/sign-macos-update.cjs
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest*.yml
            release/appcast.xml
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${RELEASE_TAG#v}
          stem="release-assets/yikan-$version"
          mac_stem="$stem-mac-arm64"
          mac_installers=("$mac_stem.dmg" "$mac_stem.dmg.blockmap" "$mac_stem.zip" "$mac_stem.zip.blockmap")
          mac_metadata=(release-assets/latest-mac.yml)
          if [[ -f release-assets/appcast.xml ]]; then
            mac_metadata+=(release-assets/appcast.xml)
          fi
          assets=("${mac_installers[@]}" "${mac_metadata[@]}")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            assets+=(
              "$stem-win-x64.exe" "$stem-win-x64.exe.blockmap" release-assets/latest.yml
              "$stem-linux-x86_64.AppImage" "$stem-linux-amd64.deb" "$stem-linux-x86_64.rpm"
              release-assets/latest-linux.yml
            )
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing release asset $asset"
              exit 1
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            previous_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            backup_dir=$(mktemp -d)
            patterns=()
            for asset in "${assets[@]}"; do
              if grep -Fxq -- "${asset##*/}" <<< "$previous_assets"; then
                patterns+=(--pattern "${asset##*/}")
              fi
            done
            if (( ${#patterns[@]} )); then
              gh release download "$RELEASE_TAG" --dir "$backup_dir" "${patterns[@]}"
            fi
            if gh release upload "$RELEASE_TAG" "${mac_installers[@]}" --clobber &&
               gh release upload "$RELEASE_TAG" "${mac_metadata[@]}" --clobber; then
              exit 0
            fi
            echo '::warning::Upload failed. Restoring previous macOS assets.'
            for asset in "${assets[@]}"; do
              backup="$backup_dir/${asset##*/}"
              if [[ -f "$backup" ]]; then
                gh release upload "$RELEASE_TAG" "$backup" --clobber || echo "::error::Could not restore $asset"
              fi
            done
            exit 1
          fi

          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == false ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$version" \
              --notes-file .github/release-notes.md
          fi

          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then
            prerelease=true
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" \
            --notes-file .github/release-notes.md
