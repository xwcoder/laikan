appId: com.xwcoder.yikan
directories:
  output: release
  buildResources: assets/icons
files:
  - dist/**/*
  - '!node_modules/**/*.map'
asar: true
npmRebuild: false
beforePack: scripts/exclude-macos-update-dependencies.cjs
afterPack: scripts/package-macos-updater.cjs
electronLanguages:
  - en-US
  - zh-CN
artifactName: ${name}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.news
  icon: assets/icons/icon.icns
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - dmg
    - zip
win:
  icon: assets/icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: News
  syncDesktopName: true
  icon: assets/icons/icon.png
  files:
    - assets/icons/icon.png
  target:
    - AppImage
    - deb
    - rpm
publish:
  provider: github
  owner: xwcoder
  repo: yikan
  releaseType: draft
