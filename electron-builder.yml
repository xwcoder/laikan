appId: com.xwcoder.laikan
directories:
  output: release
  buildResources: assets/icons
files:
  - dist/**/*
  - '!node_modules/**/*.map'
asar: true
npmRebuild: false
electronLanguages:
  - en-US
  - zh-CN
artifactName: ${name}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.news
  icon: assets/icons/icon.icns
  target:
    - dmg
    - zip
win:
  icon: assets/icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: News
  syncDesktopName: true
  icon: assets/icons/icon.png
  files:
    - assets/icons/icon.png
  target:
    - AppImage
    - deb
    - rpm
publish:
  provider: github
  owner: xwcoder
  repo: laikan
  releaseType: draft
